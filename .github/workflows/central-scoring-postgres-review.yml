name: Central Scoring PostgreSQL Integration Review

on:
  push:
    branches:
      - security-review/student-login-hardening
    paths:
      - "security-review/student-login-hardening/**"
      - ".github/workflows/central-scoring-postgres-review.yml"
  pull_request:
    branches:
      - security-review/student-login-hardening
    paths:
      - "security-review/student-login-hardening/**"
      - ".github/workflows/central-scoring-postgres-review.yml"

permissions:
  contents: read

jobs:
  disposable-postgres-integration:
    name: Disposable PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scoring_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scoring_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: scoring_review
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Confirm disposable database is ready
        run: psql -v ON_ERROR_STOP=1 -c "SELECT version();"

      - name: Create synthetic core schema
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/POSTGRES_TEST_FIXTURE_SCHEMA.sql

      - name: Apply proposed attempt schema in disposable database
        shell: bash
        run: |
          awk 'BEGIN { inside=0 } substr($0,1,2)=="/*" { inside=1; next } inside && substr($0,1,2)=="*/" { exit } inside { print }' security-review/student-login-hardening/GAME_RESULT_ATTEMPT_SCHEMA_PROPOSAL.sql.txt > /tmp/attempt-schema.sql

          test -s /tmp/attempt-schema.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/attempt-schema.sql

      - name: Apply proposed atomic functions in disposable database
        shell: bash
        run: |
          awk 'BEGIN { inside=0 } substr($0,1,2)=="/*" { inside=1; next } inside && substr($0,1,2)=="*/" { exit } inside { print }' security-review/student-login-hardening/GAME_RESULT_ATOMIC_FUNCTIONS_PROPOSAL.sql.txt > /tmp/atomic-functions.sql

          test -s /tmp/atomic-functions.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/atomic-functions.sql

      - name: Run score and idempotency integration assertions
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/POSTGRES_CENTRAL_SCORING_SMOKE_TESTS.sql

      - name: Run security and edge-case integration assertions
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/POSTGRES_CENTRAL_SCORING_EDGE_CASE_TESTS.sql

      - name: Verify scoring RPC and answer-key permissions
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/POSTGRES_CENTRAL_SCORING_ACL_TESTS.sql

      - name: Prepare concurrent final-answer attempt
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/POSTGRES_CENTRAL_SCORING_CONCURRENCY_SETUP.sql

      - name: Submit the same final answer under forced row-lock contention
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="10000000-0000-0000-0000-000000000021"
          SQL="SELECT public.record_game_attempt_answer('${TOKEN}','ci-one-point-game',19::smallint,0::smallint);"

          # Hold the real session row lock so both answer requests must queue.
          psql -v ON_ERROR_STOP=1 -Atc "BEGIN; SELECT 1 FROM public.student_game_sessions WHERE session_token='${TOKEN}' FOR UPDATE; SELECT pg_sleep(8); COMMIT;" > /tmp/session-lock-holder.log &
          lock_pid=$!

          # Do not launch either request until PostgreSQL confirms the lock is held.
          ready=0
          for attempt in $(seq 1 100); do
            if grep -q '^1$' /tmp/session-lock-holder.log 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$lock_pid" 2>/dev/null; then
              cat /tmp/session-lock-holder.log
              echo "Session lock holder exited before acquiring the lock."
              exit 1
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/session-lock-holder.log
            echo "Timed out waiting for the session row lock."
            exit 1
          fi

          # Both calls now contend for the same locked session and final answer.
          psql -v ON_ERROR_STOP=1 -Atc "$SQL" > /tmp/concurrent-answer-a.log &
          pid_a=$!
          psql -v ON_ERROR_STOP=1 -Atc "$SQL" > /tmp/concurrent-answer-b.log &
          pid_b=$!

          wait "$pid_a"
          wait "$pid_b"
          wait "$lock_pid"
          cat /tmp/concurrent-answer-a.log
          cat /tmp/concurrent-answer-b.log
      - name: Verify concurrent submission awarded exactly once
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/POSTGRES_CENTRAL_SCORING_CONCURRENCY_VERIFY.sql
