name: Student Access Concurrency Review

on:
  push:
    branches:
      - security-review/student-login-hardening
    paths:
      - "security-review/student-login-hardening/STUDENT_ACCESS_*.sql"
      - ".github/workflows/student-access-concurrency-review.yml"
  pull_request:
    branches:
      - security-review/student-login-hardening
    paths:
      - "security-review/student-login-hardening/STUDENT_ACCESS_*.sql"
      - ".github/workflows/student-access-concurrency-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  student-access-concurrency-review:
    name: Student access rate-limit and session concurrency tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: student_access_review
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d student_access_review"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: student_access_review
      PGOPTIONS: "-c lock_timeout=5s -c statement_timeout=30s"
    steps:
      - name: Check out review branch
        uses: actions/checkout@v4

      - name: Confirm isolated database is ready
        run: psql -v ON_ERROR_STOP=1 -c "SELECT version();"

      - name: Create synthetic student-access test schema
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/STUDENT_ACCESS_RATE_LIMIT_TEST_SCHEMA.sql

      - name: Apply test-only rate-limit and session functions
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/STUDENT_ACCESS_RATE_LIMIT_FUNCTIONS.sql

      - name: Run sequential rate-limit assertions
        run: psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/STUDENT_ACCESS_RATE_LIMIT_TESTS.sql

      - name: Run concurrent same-code and shared-source attempts
        shell: bash
        run: |
          set -euo pipefail

          # Twenty independent PostgreSQL connections contend on one code/source pair.
          pids=()
          for i in $(seq 1 20); do
            psql -v ON_ERROR_STOP=1 -Atc \
              "SELECT rl_test.record_failure('same-code-source','same-source');" \
              > "/tmp/same-code-${i}.log" &
            pids+=("$!")
          done
          client_status=0
          for pid in "${pids[@]}"; do wait "$pid" || client_status=1; done
          if [ "$client_status" -ne 0 ]; then
            cat /tmp/same-code-*.log
            echo "At least one same-code client failed or timed out."
            exit 1
          fi
          counted=$(grep -hxc 't' /tmp/same-code-*.log | awk '{sum += $1} END {print sum + 0}')
          cooldown_blocked=$(grep -hxc 'f' /tmp/same-code-*.log | awk '{sum += $1} END {print sum + 0}')
          test "$counted" -eq 6 && test "$cooldown_blocked" -eq 14

          psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/STUDENT_ACCESS_CONCURRENCY_TESTS.sql

          # Reset only the disposable test buckets before the shared-source case.
          psql -v ON_ERROR_STOP=1 -c "TRUNCATE rl_test.rate_limit_buckets;"

          # Twenty distinct code fingerprints contend on one source-wide bucket.
          pids=()
          for i in $(seq 1 20); do
            psql -v ON_ERROR_STOP=1 -Atc \
              "SELECT rl_test.record_failure('code-source-${i}','shared-source');" \
              > "/tmp/shared-source-${i}.log" &
            pids+=("$!")
          done
          client_status=0
          for pid in "${pids[@]}"; do wait "$pid" || client_status=1; done
          if [ "$client_status" -ne 0 ]; then
            cat /tmp/shared-source-*.log
            echo "At least one shared-source client failed or timed out."
            exit 1
          fi
          counted=$(grep -hxc 't' /tmp/shared-source-*.log | awk '{sum += $1} END {print sum + 0}')
          cooldown_blocked=$(grep -hxc 'f' /tmp/shared-source-*.log | awk '{sum += $1} END {print sum + 0}')
          test "$counted" -eq 6 && test "$cooldown_blocked" -eq 14

          psql -v ON_ERROR_STOP=1 -c "
            DO \\$check\\$
            DECLARE source_count integer; code_count integer;
            BEGIN
              SELECT failure_count INTO source_count
              FROM rl_test.rate_limit_buckets
              WHERE bucket_type='source' AND bucket_fingerprint='shared-source';
              SELECT COALESCE(sum(failure_count),0) INTO code_count
              FROM rl_test.rate_limit_buckets
              WHERE bucket_type='code_source';
              IF source_count <> 6 OR code_count <> 6 THEN
                RAISE EXCEPTION 'Shared-source concurrency failure: source %, code sum %',
                  source_count, code_count;
              END IF;
            END
            \\$check\\$;"

      - name: Run three simultaneous logins against the two-session limit
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c \
            "INSERT INTO rl_test.students(student_id) VALUES ('11111111-1111-4111-8111-111111111111');"

          pids=()
          for i in 1 2 3; do
            psql -v ON_ERROR_STOP=1 -Atc \
              "SELECT rl_test.create_portal_session('11111111-1111-4111-8111-111111111111');" \
              > "/tmp/session-${i}.log" &
            pids+=("$!")
          done
          client_status=0
          for pid in "${pids[@]}"; do wait "$pid" || client_status=1; done
          if [ "$client_status" -ne 0 ]; then
            cat /tmp/session-*.log
            echo "At least one session-creation client failed or timed out."
            exit 1
          fi

          psql -v ON_ERROR_STOP=1 -f security-review/student-login-hardening/STUDENT_ACCESS_SESSION_LIMIT_TESTS.sql
